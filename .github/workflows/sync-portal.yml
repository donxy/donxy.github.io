name: Synchronize portal data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-portal-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image-generation dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Read public source repositories
        run: |
          git clone https://github.com/donxy/awesome-RGBT-ObjectDetection.git "$RUNNER_TEMP/papers"
          git clone https://github.com/donxy/rgbt-notes.git "$RUNNER_TEMP/rgbt"
          git clone https://github.com/donxy/autonomous-driving-notes.git "$RUNNER_TEMP/driving"
      - name: Build homepage and cross-site manifest
        env:
          PAPERS_CSV: ${{ runner.temp }}/papers/papers.csv
          ISSUES_JSON: ${{ github.workspace }}/figure-teardown/issues.json
          AD_CONTENT: ${{ runner.temp }}/driving/content
        run: |
          python tools/build_homepage.py --out .
          python tools/build_site_metadata.py \
            --papers-csv "$PAPERS_CSV" \
            --issues-json "$ISSUES_JSON" \
            --ad-content "$AD_CONTENT" \
            --rgbt-content "$RUNNER_TEMP/rgbt/content" \
            --output site-metadata.json
      - name: Commit only actual changes
        run: |
          git add index.html og.png site-metadata.json
          if git diff --cached --quiet; then
            echo "Portal data already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync personal site metadata and homepage"
          git push origin HEAD:main
